<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northstar-support-deflection</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--Northstar header-->
  <header class="ns-header">
    <div class="ns-header-inner">
      <div class="ns-brand">
        <span class="ns-wordmark">Northstar</span>
      </div>
      <div class="ns-status">
        <span>Assistant online</span>
      </div>
    </div>
  </header>

  <!--Assistant panel-->
  <main>
    <section class="panel" aria-label="Support assistant">

      <div class="panel-intro">
        <h1>Hi, how can we help?</h1>
        <p>Choose what you need, and the assistant will take it from there.</p>
      </div>

      <div class="ticket-grid" id="ticketGrid">
        <!-- Order status -->
        <button class="ticket-btn" type="button" data-id="order_status" data-label="Order status" onclick="selectTicket(this)">
          <div class="ticket-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </div>
          <div class="ticket-label">Order status</div>
          <div class="ticket-desc">Track a recent order or check delivery timing</div>
          <div class="ticket-cta">
            <span class="cta-text">Start</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </div>
        </button>

        <!-- Returns and refunds -->
        <button class="ticket-btn" disabled type="button" data-id="returns_refunds" data-label="Returns and refunds" onclick="selectTicket(this)">
          <div class="ticket-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </div>
          <div class="ticket-label">Returns and refunds</div>
          <div class="ticket-desc">Start a return or check a refund</div>
          <div class="ticket-cta">
            <span class="cta-text">coming soon</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </div>
        </button>

        <!-- Stock availability -->
        <button class="ticket-btn" type="button" data-id="stock_availability" data-label="Stock availability" onclick="selectTicket(this)">
          <div class="ticket-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
              <line x1="7.5" y1="4.21" x2="16.5" y2="9.79"/>
            </svg>
          </div>
          <div class="ticket-label">Stock availability</div>
          <div class="ticket-desc">See if an item is in stock near you</div>
          <div class="ticket-cta">
            <span class="cta-text">Start</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </div>
        </button>
      </div>

      <!-- Confirmation banner -->
      <div class="confirm-banner" id="confirmBanner"></div>

      <!--Fallback-->
      <div class="fallback-row">
        <span class="fallback-text">None of these match what you need?</span>
        <button class="fallback-btn" type="button" onclick="talkToSupport()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
            <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
            <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/>
            <line x1="14.83" y1="9.17" x2="18.36" y2="5.64"/>
            <line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/>
          </svg>
          Talk to support
        </button>
      </div>

    </section>
  </main>

  <script>
    function selectTicket(btn) {
      // Handle active button state
      document.querySelectorAll('.ticket-btn').forEach(b => {
        b.classList.remove('selected');
        b.querySelector('.cta-text').textContent = 'Start';
      });
      btn.classList.add('selected');
      btn.querySelector('.cta-text').textContent = 'Selected';

      const id = btn.dataset.id;
      const label = btn.dataset.label;
      const banner = document.getElementById('confirmBanner');
      banner.classList.add('show');

      // Routing logic for the banner UI
      if (id === 'order_status') {
        banner.innerHTML = `
          <div style="margin-top: 10px; text-align: left;">
            <p style="margin-bottom: 8px;"><strong>Track your order</strong></p>
            <input type="text" id="orderIdInput" placeholder="Order ID (e.g., N-1001)" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
            <button type="button" onclick="lookupOrderStatus()" style="padding: 8px 12px; cursor: pointer; border-radius: 4px; border: none; background: #0B1220; color: white; font-family: inherit;">Track</button>
            <div id="orderResult" style="margin-top: 15px; font-size: 14px; line-height: 1.5;"></div>
          </div>
        `;
      } else if (id === 'stock_availability') {
        banner.innerHTML = `
          <div style="margin-top: 10px; text-align: left;">
            <p style="margin-bottom: 8px;"><strong>Check Stock Availability</strong></p>
            <input type="text" id="productIdInput" placeholder="Product ID (e.g., P-201)" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
            <button type="button" onclick="lookupStockAvailability()" style="padding: 8px 12px; cursor: pointer; border-radius: 4px; border: none; background: #0B1220; color: white; font-family: inherit;">Check Stock</button>
            <div id="stockResult" style="margin-top: 15px; font-size: 14px; line-height: 1.5;"></div>
          </div>
        `;
      } else {
        // Default text for other buttons
        banner.innerHTML = 'Starting <strong>' + label + '</strong>… the assistant will pick up from here.';
      }
    }

    // --- Order Status Lookup ---
    async function lookupOrderStatus() {
      const orderId = document.getElementById('orderIdInput').value.trim();
      const resultDiv = document.getElementById('orderResult');

      if (!orderId) {
        resultDiv.innerHTML = '<span style="color: #d93025;">Please enter an Order ID.</span>';
        return;
      }

      resultDiv.innerHTML = '<em>Searching...</em>';

      try {
        const response = await fetch('../data/orders.json');
        const orders = await response.json();

        const order = orders.find(o => o.orderId.toUpperCase() === orderId.toUpperCase());

        if (order) {
          const formattedStatus = order.status.charAt(0).toUpperCase() + order.status.slice(1);
          resultDiv.innerHTML = `
            <strong>Status:</strong> ${formattedStatus} <br>
            <strong>Expected Delivery:</strong> ${order.expectedDelivery} <br>
            <strong>Tracking:</strong> ${order.tracking ? order.tracking : 'Not available yet'} <br>
            <strong>Items:</strong> ${order.items.join(', ')}
          `;
        } else {
          resultDiv.innerHTML = '<span style="color: #d93025;">Order not found. Please check your ID and try again.</span>';
        }
      } catch (err) {
        console.error('Error fetching orders:', err);
        resultDiv.innerHTML = '<span style="color: #d93025;">Error: Could not retrieve orders. Please ensure you are running a local server.</span>';
      }
    }

    // --- Stock Availability Lookup ---
    async function lookupStockAvailability() {
      const productId = document.getElementById('productIdInput').value.trim();
      const resultDiv = document.getElementById('stockResult');

      if (!productId) {
        resultDiv.innerHTML = '<span style="color: #d93025;">Please enter a Product ID.</span>';
        return;
      }

      resultDiv.innerHTML = '<em>Checking inventory...</em>';

      try {
        const response = await fetch('../data/inventory.json');
        const inventory = await response.json();

        // Find all variations of this product ID (e.g., different sizes)
        const matchedItems = inventory.filter(p => p.productId.toUpperCase() === productId.toUpperCase());

        if (matchedItems.length > 0) {
          // Get the base product name from the first match
          let htmlOutput = `<strong>Product:</strong> ${matchedItems[0].productName}<br>`;
          htmlOutput += `<ul style="list-style-type: none; padding-left: 0; margin-top: 8px;">`;

          matchedItems.forEach(item => {
            const stockStatus = item.stock > 0 
              ? `<span style="color: #188038; font-weight: 500;">In Stock (${item.stock} available)</span>` 
              : `<span style="color: #d93025; font-weight: 500;">Out of Stock</span>`;
            
            htmlOutput += `<li style="margin-bottom: 4px;">Size: ${item.size} — ${stockStatus}</li>`;
          });

          htmlOutput += `</ul>`;
          resultDiv.innerHTML = htmlOutput;
        } else {
          resultDiv.innerHTML = '<span style="color: #d93025;">Product not found. Please check your Product ID and try again.</span>';
        }
      } catch (err) {
        console.error('Error fetching inventory:', err);
        resultDiv.innerHTML = '<span style="color: #d93025;">Error: Could not retrieve inventory. Please ensure you are running a local server.</span>';
      }
    }

    // --- Fallback Support ---
    function talkToSupport() {
      console.log('[AssistantPanel] fallback: talk to support');
    }
  </script>

</body>
</html>
